<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>练习1</h1>
    <button id="root">点击</button>
    <script>
        const btn = document.getElementById('root');
        function rand(min,max){
            return Math.floor(Math.random()*(max-min+1)+min);
        }
        btn.addEventListener('click',function(){
            const p = new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    //获取1-100随机数
                    let n = rand(1,100);
                    if(n<=30){
                        //将promise状态设置为成功
                        resolve(n);
                    }else{
                        //将promise状态设置为失败
                        reject(n);
                    }
                },1000);
            })
            //调用then方法
            p.then((value)=>{
                //成功的回调
                alert('成功！'+value);
            },(reason)=>{
                //失败的回调
                alert('失败！'+reason);
            })
        })
        
    </script>
</body>
</html>
