<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //正则表达式
        /*
        -正则表达式用来定义一个规则
        -通过这个规则计算机可以检查一个字符串是否符合规则
        或者将字符串中符合规则的内容提取出来
        -正则表达式也是JS中的一个对象，
        所以要使用正则表达式，需要先创建正则表达式的对象
        */
        //new RegExp(）可以接收两个参数（字符串）1.正则表达式2.匹配模式
        //通过构造函数来创建一个正则表达式的对象

        let str = "ahaaahaahS321a";
       let reg = new RegExp(str,"i");
       console.log(reg);
       reg = /a/i;
       console.log(reg);
       reg = new RegExp("a");//检查字符串是否有a
       console.log(reg);
       console.log(reg.test(str));

       let re = /abc|bcd/;
       re = /[A-Za-z]/;
       re = /[a-z]/i;//匹配模式i标识忽略大小写
       re = /[^a-z]/;
       re = /./;
       re = /\./;//只匹配.
       re = /^a/;//匹配开始位置a
       re = /a$/;//匹配结尾a
       re = /^ahahaahS321a$/;//必须和匹配的字符串完全一样

       let result = re.test(str);
       console.log(result);

       //量词

        re = /a{3}/;
        str = "abcaccaecadc";
        re = /a(([a-z])c)/ig;//g表示全局匹配

       result = re.exec(str);//提取匹配的字符串
       console.log(result);
       while(result){
        console.log(result[0],result[1],result[2]);
        result = re.exec(str);
       }

       str = "sad13765475678dsadsa13856789098erthjy13512345678ertyujhg";
       result = str.search("abc");
       console.log(result);
       result = str.search(/1[3-9]\d{9}/);
       result = str.replace(/1[3-9]\d{9}/g,"哈哈哈");
       console.log(result);
       result = str.match(/1[3-9]\d{9}/g); 
       console.log(result);
       result = str.matchAll(/1[3-9]\d{9}/g); 
       for(let item of result){
        console.log(item);
       }


    </script>
</head>
<body>
    
</body>
</html>
