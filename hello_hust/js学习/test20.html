<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //Math
        console.log(Math.PI)
        let result = Math.abs(10)
        result = Math.abs(-10)
        console.log(result)
        result = Math.min(10, 20, 30, 44, 55, -1)
        console.log(result)
        result = Math.max(10, 20, 3, 44, 55, -1)
        console.log(result)
        result = Math.pow(4, 2)// 4 ** 2
        console.log(result)
        result = Math.sqrt(4)// 4 ** .5
        console.log(result)

        result = Math.floor(1.2)
        console.log(result)
        result = Math.ceil(1.2)
        console.log(result)
        result = Math.round(1.4)
        console.log(result)
        result = Math.trunc(1.5)
        console.log(result)

        for (let i = 0; i < 50; i++) {
        
        // 生成0-5之间的随机数
        // Math.random( ) --> 0 - 1
        // 生成0 - x之间的随机数 
        
            // Math.round(Math.random() * x);
            result = Math.round(Math.random() * 5)
            console.log(result)
        }



    </script>
