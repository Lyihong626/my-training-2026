<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //数组的方法
        let arr=["a","b","c","e","d"];
        arr = [2,5,4,7,9,1,0,6];
        //sort()
        console.log(arr);
        arr.sort();
        console.log(arr);
        //默认升序
        arr.sort((a,b)=>b-a);
        console.log(arr);
        //遍历
        //forEach()
        arr.forEach(()=>{
            console.log("1111");
        })
        arr.forEach((element,index,array)=>{
            console.log(array);
        })
        //filter()过滤函数
        let result = arr.filter(ele=>ele%2===0)
        console.log(result);

        //map
        result = arr.map(ele=>ele*2);
        result = arr.map(ele=>"<li>"+ele+"</li>");
        console.log(result);

        //reduce()
        arr.reduce((a,b)=>{
            console.log(a+b);
            return a+b;
            // return a*b
        },10)

        //隐含参数arguments,不受参数数量的限制,更加灵活创建函数
        function sum(){
            let res=0;
            for (let num of arguments){
                res+=num;
            }
            return res;
        }
        //可变参数
        //可以接受任意数量的实参，并将它们同一存储在数组
        function fn2(...abc){
            console.log(abc);
        }

        const obj = {name:"孙悟空",fn2};

        //call   apply
        function fn3(a,b){
            console.log("a=",a,"b=",b,this);
        }
        fn3.call(obj,"1111","2222");
        fn3.apply(obj,[111,222]);

        //bind()
        function fn4(a,b,c){
            console.log("zhixingl====");
            return a+b+c;

        }
        obj2 = {name:"孙悟空"};
        const newFn = fn4.bind(obj2,10,20,30);
        console.log(newFn());

</script>
</head>
<body>
    
</body>
</html>
