<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加信息</title>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
        //点击按钮，添加
        const btn = document.getElementById("btn01");
        const btn2 = document.getElementById("btn02");
        const btn3 = document.getElementById("btn03");

        const list = document.getElementById("list");
        btn.onclick = function(){
            //创建li
            const li = document.createElement("li");
            //向li添加文本
            li.textContent = "唐僧";
            //给li添加id属性
            li.id = "ts";
            console.log(li);
            list.appendChild(li);
        }

        btn2.onclick = function(){
            const li = document.createElement("li");
            li.textContent="蜘蛛精";
            li.id="zzj";
            //获取孙悟空li
            const swk = document.getElementById("swk");
            swk.replaceWith(li);
        }

        btn3.onclick = function(){
            const ts = document.getElementById("ts");
            ts.remove();
        }

        
    });
    </script>
</head>
<body>
    <button id="btn01">按钮1</button>
    <button id="btn02">替换</button>
    <button id="btn03">删除唐僧</button>
    <hr>
    <ul id="list">
        <li id="swk">孙悟空</li>
        <li id="zbj">猪八戒</li>
        <li id="shs">沙和尚</li>
    </ul>

</body>
</html>
