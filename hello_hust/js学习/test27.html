<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择</title>
    <script>
        window.addEventListener("DOMContentLoaded",function(){
            /*
            全选功能
            */
            //获得四个多选框
            const hobbies = document.getElementsByName("hobby");
            console.log(hobbies);
            //获取全选矿
            const allBtn = document.getElementById("all");
            console.log(allBtn);
            //为按钮绑定单击响应函数
            allBtn.onclick = function () {
                //将多选框设置为选中状态
                for (let i = 0; i < hobbies.length; i++) {
                    hobbies[i].checked = true;
                    console.log("修改"+i);
                }
                checkAll.checked=true;
            }

            /*
                取消功能
            */
           //获取取消按钮
           const noBtn = document.getElementById("no");
           
           noBtn.onclick = function () {
                //将多选框设置为选中状态
                for (let i = 0; i < hobbies.length; i++) {
                    hobbies[i].checked = false;
                    console.log("修改"+i);
                }
                checkAll.checked=false;
            }

            /*
                反选功能
            */
           //获取反选按钮
           const reverseBtn = document.getElementById("reverse");
           
           reverseBtn.onclick = function () {
                //将多选框设置为选中状态
                for (let i = 0; i < hobbies.length; i++) {
                    hobbies[i].checked = !hobbies[i].checked;
                    console.log("修改"+i);
                }
                const checkedBox = document.querySelectorAll("[name=hobby]:checked");
                //判断是否是全选
                if(hobbies.length===checkedBox.length){
                    checkAll.checked=true;
                }else{
                    checkAll.checked=false;
                }
            }

            /*
                提交功能
            */
           //获取取消按钮
           const sendBtn = document.getElementById("send");
           
           sendBtn.onclick = function () {
                //将多选框设置为选中状态
                for (let i = 0; i < hobbies.length; i++) {
                    if(hobbies[i].checked){
                        alert(hobbies[i].value);
                        console.log(hobbies[i].value);
                    }
                }
            }

            /*
                check-all，点击全选，也选中
            */
           const checkAll = document.getElementById("check-all");
           checkAll.onchange = function(){
            //  在事件的响应函数中，响应函数绑定谁 this就是谁(箭头函数除外)
                for(let i=0;i<hobbies.length;i++){
                    hobbies[i].checked = this.checked;
                }
           }

           /*
            当四个全选的时候，全选框也要勾选
            当四个都未选，全选框不勾选
           */
           for(let i=0;i<hobbies.length;i++){
            hobbies[i].onchange = function(){
                const checkedBox = document.querySelectorAll("[name=hobby]:checked");
                console.log(checkedBox.length);
                //判断是否是全选
                if(hobbies.length===checkedBox.length){
                    checkAll.checked=true;
                }else{
                    checkAll.checked=false;
                }
            }
           }
        })
            

    </script>
</head>

<body>
    <div>
        <form action="#">
            <div>
                请选择你的爱好：
                <input type="checkbox" id="check-all" />全选
            </div>
            <div>
                <input type="checkbox" name="hobby" value="乒乓球" />乒乓球
                <input type="checkbox" name="hobby" value="篮球" />篮球
                <input type="checkbox" name="hobby" value="羽毛球" />羽毛球
                <input type="checkbox" name="hobby" value="足球" />足球
            </div>
            <div>
                <button type="button" id="all">全选</button>
                <button type="button" id="no">取消</button>
                <button type="button" id="reverse">反选</button>
                <button type="button" id="send">提交</button>
            </div>
        </form>
    </div>

</body>

</html>
