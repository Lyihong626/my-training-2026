<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--节点的复制-->
    <button id="btn01">点击</button>
    <ul id="list1">
        <li id="l1">孙悟空</li>
        <li id="l2">猪八戒</li>
        <li id="l3">沙和尚</li>
    </ul>

    <ul id="list2">
        <li>蜘蛛精</li>
    </ul>
    <script>
        /*点击后，将id为l1的元素添加到list2中*/
        const list2 = document.getElementById("list2");
        const l1 = document.getElementById("l1");
        const btn01 = document.getElementById("btn01");
        btn01.onclick = function(){
            const newL1 = l1.cloneNode(true);//用来对节点进行复制
            /*
             使用cloneNode（）方法对节点进行复制，他会复制节点的所有特点包括各种属性
               这个方法默认只会复制当前节点，不复制子元素 
               可以传递true作为参数，这样该方法也会复制子节点
             */
            newL1.id = "newL1";
            list2.append(newL1);
        }
    </script>
</body>
</html>
