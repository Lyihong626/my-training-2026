<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇案例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #main {
            height: 420px;
            width: 360px;
            border: 10px #000 solid;
            background-color: #b7d4a5;
            border-radius: 20px;
            margin: 50px auto;
        }

        #stage {
            width: 304px;
            height: 304px;
            border: 2px solid #000;
            margin: 20px auto;
            position: relative;
        }

        #snake>div {
            width: 10px;
            height: 10px;
            background-color: #000;
            position: absolute;
            
            border: 1px solid #b7d4a5;
        }

        #food {
            width: 10px;
            height: 10px;
            /* background-color: #000; */
            position: absolute;
            top: 100px;
            left: 120px;
            display: flex;
            flex-flow: wrap;
        }

        #food>div {
            width: 5px;
            height: 5px;
            background-color: #000;
            transform: rotate(45deg);
        }

        #info {
            width: 304px;
            margin: 20px auto;
            display: flex;
            justify-content: space-between;
            font: bold 20px courier;
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="stage">
            <div id="snake">
                <div></div>
            </div>
            <div id="food">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
        <div id="info">
            <div>SCORE:<span id="score">0</span></div>
            <div>LEVEL:<span id="level">1</span></div>
        </div>
    </div>
    <script>
        /*获取蛇的容器*/
        const snake = document.getElementById("snake");
        //获取蛇的各个部分
        const snakes = snake.getElementsByTagName("div");
        const head = snakes[0];


        //获取食物
        const food = document.getElementById("food");

        //获取分数
        const scoreSpan = document.getElementById("score");
        const levelSpan = document.getElementById("level");

        let score=0;
        let level=0;

        /*食物坐标在0-290*/
        function changeFood() {
            //生成0-29之间的随机数
            const foodX = Math.floor(Math.random() * 30) * 10;
            const foodY = Math.floor(Math.random() * 30) * 10;
            //生成食物坐标
            food.style.left = foodX + "px";
            food.style.top = foodY + "px";

        }

        //定一个变量，用来存储蛇的移动方向
        let dir;
        /*禁止掉头
            1、身体超过2
            2、不能是相反方向
        */

        //创建变量记录按键状态
        let keyActive = true;

        const keyArr = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
        const reArr = {
            ArrowUp: "ArrowDown",
            ArrowDown: "ArrowUp",
            ArrowLeft: "ArrowRight",
            ArrowRight: "ArrowLeft"
        };

        document.addEventListener("keydown", (event) => {
            //设置方向
            if (keyArr.includes(event.key)) {
                if (snakes.length < 2 || reArr[dir] !== event.key) {
                    dir = event.key;
                    keyActive = false;
                }
            }
        })

        /*
            绑定按键事件keydown keyup
                键盘事件只能啊绑定给可以获取焦点的元素或者document
        */

        /*通过时间对象可以读取到用户俺的是哪个按键*/
        // console.log(event.keyCode);
        // console.log(event.key);


        setTimeout(function move() {

            //获取蛇头

            const head = snakes[0];
            //蛇头坐标
            let x = head.offsetLeft;
            let y = head.offsetTop;

            switch (dir) {

                case "ArrowUp":
                    console.log("↑");
                    y -= 10;
                    break;
                case "ArrowDown":
                    console.log("↓");
                    y += 10;
                    break;
                case "ArrowLeft":
                    console.log("←");
                    x -= 10;
                    break;
                case "ArrowRight":
                    console.log("→");
                    // console.log(head);
                    //向右移动蛇
                    x += 10;
                    break;
            }

            //检查蛇是否吃到食物
            if (
                head.offsetTop === food.offsetTop &&
                head.offsetLeft === food.offsetLeft
            ) {
                console.log("吃到食物");
                //改变食物位置
                changeFood();
                //增加蛇的身体
                snake.insertAdjacentHTML("beforeend", "<div/>");//快速将HTML文本解析成节点并插入
                score++;
                scoreSpan.textContent = score;

                //检查等级
                if(score%3===0&&level<14){
                    level++;
                    levelSpan.textContent = level+1;
                    console.log(level);
                }
            }
            /*判断游戏结束：
                1、撞墙
                2、装自己*/
            if (x < 0 || x > 290 || y < 0 || y > 290) {
                alert("撞墙了");
                return;

            }
            //判断装自己
            for (let i = 0; i < snakes.length-1; i++) {
                if (snakes[i].offsetLeft === x && snakes[i].offsetTop === y) {
                    alert("撞自己");
                    return;
                }
            }

            //获取尾巴
            //移动蛇的位置：移动的是尾巴位置
            const tail = snakes[snakes.length - 1];
            //移动位置
            tail.style.left = x + "px";
            tail.style.top = y + "px";
            //将尾巴移动到蛇头位置
            snake.insertAdjacentElement("afterbegin", tail);//移动或克隆一个现有的元素到新位置
            keyActive = true;

            setTimeout(move, 300-level*20);
        }, 300)



    </script>
</body>

</html>
