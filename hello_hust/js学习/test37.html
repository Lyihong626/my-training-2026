<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="btn">点击</button>
    <hr>
    <ul id="list">
        <li><a href="javascript:;">链接一</a></li>
        <li><a href="javascript:;">链接二</a></li>
        <li><a href="javascript:;">链接三</a></li>
        <li><a href="javascript:;">链接四</a></li>
    </ul>
    <script>
        const links = document.getElementsByTagName("a");
        /*
        getElementsByTagName 返回的是一个「实时集合」（live HTMLCollection），它会自动跟随 DOM 的变化而更新。
        而之前用的 querySelectorAll 返回的是「静态 NodeList」，不会自动更新。
        */
        const list = document.getElementById("list");
        const btn = document.getElementById("btn");

        // for(let i=0;i<links.length;i++){
        //     links[i].addEventListener("click",(event)=>{
        //         alert(event.target.textContent);
        //     })
        // }

        document.addEventListener("click",(event)=>{
            //事件的委派
            //在执行代码前，先判断一下事件是由谁触发的
            //检查event.target是否在listk中存在
            // console.log(Array.from(links));

            // alert(event.target.textContent);
            if([...links].includes(event.target)){
                alert(event.target.textContent);
            }
        })

        //点击按钮，在ul中添加新的的li
        btn.addEventListener("click",()=>{
            list.insertAdjacentHTML(
                "beforeend",
                "<li><a href='javascript:;'>新链接</a></li>"
            )
        })
    </script>
</body>
</html>
