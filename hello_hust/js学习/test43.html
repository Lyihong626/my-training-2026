<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轮播图案例练习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        img {
            vertical-align: top;
        }

        ul {
            list-style: none;
        }

        img {
            width: 800px;
            height: 300px;
        }

        .outer {
            position: relative;
            width: 800px;
            height: 300px;
            margin: 100px auto;
        }

        .img-list li {
            position: absolute;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        li.current {
            z-index: 1;
            opacity: 1;
        }

        /*
        设置箭头样式
        */
        .prev-next a {
            font-size: 60px;
            color: #fff;
            font-weight: bold;
            text-decoration: none;
            position: absolute;
            height: 60px;
            top: 0;
            bottom: 0;
            margin: auto;
            z-index: 2;
            opacity: 0.5;
        }

        #next {
            right: 0;
        }

        .prev-next a:hover {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="outer">
        <ul class="img-list">
            <li class="current">
                <a href="#">
                    <img src="../image/bigimg1.jpg" alt="">
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="../image/bigimg2.jpg" alt="">
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="../image/bigimg3.jpg" alt="">
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="../image/bigimg4.jpg" alt="">
                </a>
            </li>
        </ul>
        <!--切换按钮-->
        <div class="prev-next">
            <a id="prev" href="javascript:;">《</a>
            <a id="next" href="javascript:;">》</a>
        </div>

    </div>
    <script>
        /*
        自动切换图片
        */
        let timer = null;
        const autoChange = () => {
            //判断timer是否为null
            if (timer === null) {
                timer = setTimeout(function auto() {
                    changeImg("next");

                    setTimeout(auto, 2000);
                }, 2000)
            } else {
                clearTimeout(timer);
                timer = null;
            }

        }
        autoChange();

        const outer = document.getElementsByClassName("outer")[0];
        outer.onmouseenter = () => {
            autoChange();
        }
        outer.onmouseleave = () => {
            autoChange();
        }


        //按钮
        const prev = document.getElementById("prev");
        const next = document.getElementById("next");

        prev.onclick = () => {
            changeImg("prev");
        }
        next.onclick = () => {
            changeImg("next");
        }

        function changeImg(dir) {
            //改变图片
            //参数dir  切换方向：next  prev

            //获取当前显示的图片
            const current = document.querySelector(".img-list .current");
            //获取下一张图片
            let next;
            if (dir === "next") {
                next = current.nextElementSibling ||
                    document.getElementsByTagName("li")[0];
            } else if (dir === "prev") {
                next = current.nextElementSibling ||
                    document.querySelector("li:last-child");
            }
            //切换显示状态
            current.classList.remove("current");
            next.classList.add("current");
        }


    </script>
</body>

</html>
