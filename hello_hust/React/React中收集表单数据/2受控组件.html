<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="test"></div>
    <!--引入react核心库-->
    <script type="text/javascript" src="../../js/react.development.js"></script>
    <!--引入react-dom库-->
    <script type="text/javascript" src="../../js/react-dom.development.js"></script>
    <!--引入babel库-->
    <script type="text/javascript" src="../../js/babel.min.js"></script>
    <!--引入props-types,用于对组件标签属性进行限制-->
    <script type="text/javascript" src="../../js/prop-types.js"></script>
    <script type="text/babel">
        //创建组件  随着输入 维护状态
        //受控组件：输入框的value由组件的state控制，输入框的内容只能通过修改state来修改
        //受控组件的好处：可以实时获取输入框的内容，可以对输入框的内容进行校验，限制输入框的内容等
        class Login extends React.Component {
            saveUsername = (event) => {
                console.log(event.target.value);
                this.setState({ username: event.target.value });
            }
            savePassword = (event) => {
                console.log(event.target.value);
                this.setState({ password: event.target.value });
            }
            handleSubmit = (event) => {
                //阻止表单的提交
                event.preventDefault();
                const { username, password } = this.state;
                //存储的已经是输入的内容了，不需要再通过ref获取输入框的value了
                alert(`你输入的用户名：${username}，密码：${password}`);
            }
            render() {
                return (
                    <form onSubmit={this.handleSubmit}>
                        用户名：<input onChange={this.saveUsername} type="text" placeholder="请输入用户名" />
                        密码：<input onChange={this.savePassword} type="password" placeholder="请输入密码" />
                        <button>登录</button>
                    </form>
                )
            }
        }
        //渲染组件
        ReactDOM.render(<Login />, document.getElementById('test'));
    </script>
</body>

</html>
