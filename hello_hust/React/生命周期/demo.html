<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .list {
            width: 200px;
            height: 150px;
            background-color: skyblue;
            overflow: auto;
        }

        .news {
            height: 30px;
        }
    </style>
</head>

<body>
    <!--准备一个容器-->
    <div id="test"></div>
    <!--引入react核心库-->
    <script type="text/javascript" src="../17.0.1/react.development.js"></script>
    <!--引入react-dom库-->
    <script type="text/javascript" src="../17.0.1/react-dom.development.js"></script>
    <!--引入babel库-->
    <script type="text/javascript" src="../17.0.1/babel.min.js"></script>
    <!--引入props-types,用于对组件标签属性进行限制-->
    <script type="text/javascript" src="../17.0.1/prop-types.js"></script>
    <script type="text/babel">
        class NewList extends React.Component {
            state = {newsArr:[]};

            componentDidMount(){
                setInterval(()=>{
                    //读取原状态
                const {newsArr} = this.state;
                //模拟一条新闻
                const news = "新闻"+(newsArr.length+1);
                //更新状态
                this.setState({newsArr:[news,...newsArr]});
                },1000);
            }
            getSnapshotBeforeUpdate(){
                return this.refs.list.scrollHeight;
            }
            componentDidUpdate(preProps,preState,height){
                this.refs.list.scrollTop +=( this.refs.list.scrollHeight - height);
            }
            render() {
                return (
                    <div className="list" ref="list">
                        {
                            this.state.newsArr.map( (n,index)=>{
                                return <div key={index} className="news">{n}</div>
                            })
                        }
                        </div>
                )
            }
        }
        //渲染组件
        ReactDOM.render(<NewList />, document.getElementById('test'));
    </script>
</body>

</html>
