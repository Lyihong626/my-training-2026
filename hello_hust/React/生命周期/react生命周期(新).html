<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!--准备一个容器-->
    <div id="test"></div>
    <!--引入react核心库-->
    <script type="text/javascript" src="../17.0.1/react.development.js"></script>
    <!--引入react-dom库-->
    <script type="text/javascript" src="../17.0.1/react-dom.development.js"></script>
    <!--引入babel库-->
    <script type="text/javascript" src="../17.0.1/babel.min.js"></script>
    <!--引入props-types,用于对组件标签属性进行限制-->
    <script type="text/javascript" src="../17.0.1/prop-types.js"></script>
    <script type="text/babel">
        //创建组件
        //生命周期回调函数
        class Count extends React.Component {
            //构造器
            constructor(props) {
                super(props);
                console.log('constructor');
                //初始化状态
                this.state = { count: 0 }
            }
            //加1的方法的回调
            add = () => {
                //获取原状态
                const { count } = this.state;
                //更新状态
                this.setState({ count: count + 1 });
            }
            //卸载组件按钮的回调
            death = () => {
                //卸载组件
                ReactDOM.unmountComponentAtNode(document.getElementById('test'));
            }
            //强制更新
            force = () => {
                this.forceUpdate();
            }
            //此方法适用于罕见的用例，即state的值在任何时候都取决于props.
            static getDerivedStateFromProps(props,state){
                console.log("getDerivedStateFromProps",props,state);
                return null;
            }
            //在更新之前获取快照
            getSnapshotBeforeUpdate(){
                console.log("getSnapshotBeforeUpdate");
                return 'atguigu';
            }
            //组件挂在完毕的钩子
            componentDidMount() {
                console.log('count-----componentDidMount');
            }
            //组件是否更新的钩子，返回true则更新，返回false则不更新
            shouldComponentUpdate() {
                console.log('count-----shouldComponentUpdate');
                return true;
            }
            //组件更新完毕的钩子
            componentDidUpdate(preProps,preState) {
                console.log('count-----componentDidUpdate',preProps,preState);
            }
            render() {
                console.log('count-----render');
                const { count } = this.state;
                return (
                    <div>
                        <h2>当前计数：{count}</h2>
                        <button onClick={this.add}>加1</button>
                        <button onClick={this.death}>卸载组件</button>
                        <button onClick={this.force}>强制更新</button>
                    </div>
                )
            }
        }

        class A extends React.Component {
            //初始化状态
            state = { carName: 'benchi' }
            changeCar = () => {
                this.setState({ carName: 'aodi' })
            }

            render() {
                return (
                    <div>
                        <div>A</div>
                        <button onClick={this.changeCar}>换车</button>
                        <B carName={this.state.carName}/>
                    </div>
                )
            }
        }
        class B extends React.Component{
            //组件将要接受新的props的钩子,第一次传的不算
            // componentWillReceiveProps(props){
            //     console.log("B---componentWillReceiveProps",props);
            // }
            
            render(){
                console.log("B----render");
                return(
                    <div>我是B组件，接收到的车是：{this.props.carName}</div>
                )
            }
        }
        //渲染组件
        ReactDOM.render(<Count count={199}/>, document.getElementById('test'));
    </script>
</body>

</html>
