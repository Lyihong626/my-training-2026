<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="test"></div>
    <!--引入React核心库-->
    <script type="text/javascript" src="../React/17.0.1/react.development.js"></script>
    <!--引入react-dom库-->
    <script type="text/javascript" src="../React/17.0.1/react-dom.development.js"></script>
    <!--引入babel库-->
    <script type="text/javascript" src="../React/17.0.1/babel.min.js"></script>
    <!--引入props-types,用于对组件标签属性进行限制-->
    <script type="text/javascript" src="../React/17.0.1/prop-types.js"></script>
    <script type="text/babel">
        class Time extends React.Component {
            state = { date: new Date() }
            /*Diffing算法对比的最小层次是标签*/

            componentDidMount() {
                setInterval(() => {
                    this.setState({
                        date: new Date()
                    })
                }, 1000)
            }
            render() {
                return (
                    <div>
                        <h1>hello</h1>
                        <input type="text" />
                        <span>现在是:{this.state.date.toTimeString()}</span>
                    </div>
                )
            }
        }

        ReactDOM.render(<Time />, document.getElementById('test'));

    </script>
</body>

</html>
