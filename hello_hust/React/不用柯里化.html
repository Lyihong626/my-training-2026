<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="test"></div>
    <!--引入react核心库-->
    <script type="text/javascript" src="../js/react.development.js"></script>
    <!--引入react-dom库-->
    <script type="text/javascript" src="../js/react-dom.development.js"></script>
    <!--引入babel库-->
    <script type="text/javascript" src="../js/babel.min.js"></script>
    <!--引入props-types,用于对组件标签属性进行限制-->
    <script type="text/javascript" src="../js/prop-types.js"></script>
    <script type="text/babel">
        class Login extends React.Component {
            //初始化状态
            state = {
                username: '',
                password: ''
            }
            //保存表单数据到状态中
            saveFormData = (dataType, value) => {
                console.log(dataType, value);
                this.setState({ [dataType]: value });
            }
            //表单提交的回调
            handleSubmit = (event) => {
                //阻止表单的提交
                event.preventDefault();
                const { username, password } = this.state;
                //存储的已经是输入的内容了，不需要再通过ref获取输入框的value了
                alert(`你输入的用户名：${username}，密码：${password}`);
            }
            render() {
                return (
                    <form onSubmit={this.handleSubmit}>
                        用户名：<input onChange={event=>this.saveFormData('username',event.target.value)} name="username" type="text" />
                        密码：<input onChange={event=>this.saveFormData('password',event.target.value)} name="password" type="password"/>
                        <button>登录</button>
                    </form>
                )
            }
        }
        //渲染组件
        ReactDOM.render(<Login />, document.getElementById('test'));
    </script>
</body>
</html>
